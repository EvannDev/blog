# Pull request : build du site (le frontmatter est validé) et de l'image, test de fumée durci, sans publication.
# Merge sur main : image multi-arch publiée sur ghcr.io/evanndev/blog:1.0.<n> (+ sha-<commit>), avec provenance
# SLSA et SBOM. Renovate (dépôt platform) détecte le nouveau tag et met à jour le déploiement ; Argo CD l'applique.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build du site (valide le frontmatter)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Test de fumée (mêmes contraintes que dans Kubernetes)
        run: |
          set -eu
          docker buildx build --platform linux/amd64 --load -t blog:ci --cache-from type=gha .
          docker run -d --name blog --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65532:65532 -p 8080:8080 blog:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health >/dev/null && break; sleep 1; done

          check() { code=$(curl -s -o /dev/null -w '%{http_code}' -X "${3:-GET}" "http://localhost:8080$1"); echo "${3:-GET} $1 -> $code (attendu $2)"; [ "$code" = "$2" ]; }
          check / 200
          check /blog/ 200
          check /rss.xml 200
          check /sitemap-index.xml 200
          check /health 200
          check /page-inexistante 404
          check /.git/config 404
          check /../../etc/passwd 404
          check / 405 POST
          check / 405 DELETE

          h=$(curl -sI http://localhost:8080/)
          for header in content-security-policy strict-transport-security x-frame-options x-content-type-options referrer-policy; do
            echo "$h" | grep -qi "^$header:" || { echo "en-tête manquant : $header"; exit 1; }
          done
          echo "$(curl -sI http://localhost:8080/page-inexistante)" | grep -qi '^content-security-policy:' || { echo "CSP absente sur la 404"; exit 1; }
          asset=$(curl -s http://localhost:8080/ | grep -oE '/_astro/[^"]+\.(css|js|woff2?)' | head -1)
          if [ -n "$asset" ]; then curl -sI "http://localhost:8080$asset" | grep -qi 'immutable' || { echo "asset sans cache immuable : $asset"; exit 1; }; fi

          # L'image ne doit contenir ni shell ni outils
          if docker run --rm --entrypoint /bin/sh blog:ci -c true 2>/dev/null; then echo "un shell est présent dans l'image"; exit 1; fi
          docker logs blog 2>&1 | tail -5
          docker rm -f blog

      - name: Connexion à ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (et push sur main) de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/evanndev/blog:1.0.${{ github.run_number }}
            ghcr.io/evanndev/blog:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=blog
          cache-from: type=gha
          cache-to: type=gha,mode=max
