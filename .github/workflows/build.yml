# Pull request : build du site (le frontmatter est validé) et de l'image, sans publication.
# Merge sur main : image multi-arch publiée sur ghcr.io/evanndev/blog:1.0.<n> (+ sha-<commit>).
# Renovate (dépôt platform) détecte le nouveau tag et met à jour le déploiement ; Argo CD l'applique.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build du site (valide le frontmatter)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Test de fumée de l'image (amd64, lecture seule, non-root)
        run: |
          docker buildx build --platform linux/amd64 --load -t blog:ci --cache-from type=gha .
          docker run -d --name blog --read-only --tmpfs /tmp -p 8080:8080 blog:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check / 200
          check /blog/ 200
          check /rss.xml 200
          check /sitemap-index.xml 200
          check /page-inexistante 404
          curl -sI http://localhost:8080/ | grep -qi '^content-security-policy:'
          docker logs blog 2>&1 | (! grep -iE '\[(emerg|crit|alert)\]')
          docker rm -f blog

      - name: Connexion à ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (et push sur main) de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/evanndev/blog:1.0.${{ github.run_number }}
            ghcr.io/evanndev/blog:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=blog
          cache-from: type=gha
          cache-to: type=gha,mode=max
