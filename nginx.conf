server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;          # derrière la Gateway : redirections relatives, sans port interne

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_min_length 1024;

    # Fichiers d'assets d'Astro : noms hachés, donc cache long et immuable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Sonde de santé pour Kubernetes (pas de log)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
